version: '3.8'

services:
  app:
    build: .
    volumes:
      - .:/app/app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
    ports:
      - "3306:3306"
