services:
  app:
    build: .
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
    depends_on:
      # アプリケーションがDBに接続を試みる前に、dbサービスが起動していることを保証する
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
    ports:
      - "3306:3306"
    volumes:
      # ローカルのSQLファイルをコンテナ内の初期化ディレクトリにマウントする
      - ./docker/db/sql:/docker-entrypoint-initdb.d
