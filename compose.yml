name: tsmyadmin

# ----------------------------
# 1. Services (サービス定義)
# ----------------------------
services:

  # 🔹 MySQLデータベースサービス
  db:
    image: mysql:8.4
    container_name: mysql_tsmyadmin
    environment:
      # **環境変数ファイル（.env）から読み込むことを推奨**
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}       # 使用するデータベース名
      MYSQL_USER: ${DB_USER}           # アプリケーションユーザー
      MYSQL_PASSWORD: ${DB_PASSWORD}   # アプリケーションパスワード
    volumes:
      # データ永続化のためのボリューム設定
      - db_data_tsmyadmin:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    ports:
      # ホストの3306ポートを公開 (開発用)
      - "3306:3306"
    restart: always

  # 🔹 NestJSバックエンドAPIサービス
  backend:
    container_name: nestjs_api
    build:
      context: ./backend     # backendディレクトリを見る
      dockerfile: Dockerfile # 使用するDockerfile名
    environment:
      # DB接続URLを環境変数で渡す。ホスト名は 'db' (サービス名) を使うのがポイント！
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}?schema=public
      NODE_ENV: development
    volumes:
      - ./backend:/app
    ports:
      - "3001:3001" # ホストの3001ポートを内部にマッピング
    depends_on:
      # DBが起動してからバックエンドも立ち上がるように依存関係を設定
      - db
    command: npm run start:dev # 実行時のコマンドを指定

  # 🔹 Next.jsフロントエンドUIサービス
  frontend:
    container_name: nextjs_ui
    build:
      context: ./frontend   # frontendディレクトリを見る
      dockerfile: Dockerfile
    environment:
      # APIのURLを設定 (NestJSがコンテナ名でサービスとしてアクセス可能)
      NEXT_PUBLIC_API_BASE_URL: http://backend:3001/api
      NODE_ENV: development
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000" # ホストの3000ポートを内部にマッピング
    depends_on:
      # バックエンドが動いていれば、それも起動した状態にしておく
      - backend

# ----------------------------
# 2. Volumes (永続化データ)
# ----------------------------
volumes:
  db_data_tsmyadmin: # MySQLのデータを保持するボリューム
